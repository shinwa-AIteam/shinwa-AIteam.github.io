<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="shortcut icon" href="./shinwa.ico"/>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月度デザイン（月次レポート）</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
  body { font-family: "Hiragino Sans","メイリオ",sans-serif; margin: 0; background:#f4f6f9; color:#222; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4em; }
  .panel { background:#fff; border-radius:8px; padding:16px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .charts { display:flex; flex-wrap:wrap; gap:16px; }
  .chart-box { flex:1 1 480px; min-width:300px; }
  table { border-collapse:collapse; width:100%; font-size:0.9em; }
  th, td { border:1px solid #999; padding:5px 7px; text-align:center; }
  th { background:#e8eef7; }
  td:first-child { text-align:left; }
  .tables { display:flex; flex-wrap:wrap; gap:16px; }
  .tables > div { flex:1 1 480px; min-width:300px; }
  button { font-size:1.05em; padding:12px 24px; border:none; border-radius:6px; background:#4472C4; color:#fff; cursor:pointer; }
  button:disabled { background:#aaa; cursor:default; }
  #dlBtn:hover:not(:disabled) { background:#6FB7E8; }
  .back:hover { background:#aaa; }
  .actions { text-align:center; margin:18px 0; }
  .back { background:#888; margin-left:8px; }
  #msg { padding:10px; border-radius:6px; display:none; margin-bottom:12px; }
  #msg.err { display:block; background:#fde8e8; color:#c00; }
  #msg.ok  { display:block; background:#e8f6e8; color:#060; }
  .note { font-size:.85em; color:#666; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">月度デザイン</h1>
  <div id="msg"></div>

  <div class="panel" style="display:flex;align-items:center;gap:10px;padding:10px 16px;">
    <label for="ymSel" style="font-weight:bold;">対象年月：</label>
    <select id="ymSel" style="font-size:1em;padding:6px 10px;"></select>
  </div>

  <div class="panel">
    <div class="charts">
      <div class="chart-box"><canvas id="chartLeft"></canvas></div>
      <div class="chart-box"><canvas id="chartRight"></canvas></div>
    </div>
  </div>

  <div class="panel">
    <div class="tables">
      <div id="tblLeft"></div>
      <div id="tblRight"></div>
    </div>
    <p class="note">※ 残業時間は作業記録の業務内容「残業」の当月作業時間合計です。過去月（年月実績シート参照分）は時間データがないため、生産時間・残業時間・1時間あたりの生産額は「―」表示です。コメント欄は出力したPowerPointに直接入力してください。</p>
  </div>

  <div class="actions">
    <button id="dlBtn" disabled>PowerPointをダウンロード</button>
    <button class="back" onclick="history.back()">戻る</button>
  </div>
</div>

<script>
const GAS = new URLSearchParams(location.search).get("gas") || "";
const msg = document.getElementById("msg");
function showMsg(cls, text){ msg.className = cls; msg.textContent = text; }

/* ---------- 対象月の計算（選択式） ---------- */
function ym(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }
const now = new Date();
let curD, prevD, yaD, CUR, PREV, YA, curM, lblCur, lblPrev, lblYA;
function setTarget(ymStr){ // "2026-10" 形式
  const p = ymStr.split("-"), y = +p[0], m = +p[1];
  curD  = new Date(y, m-1, 1);
  prevD = new Date(y, m-2, 1);
  yaD   = new Date(y-1, m-1, 1);
  CUR = ym(curD); PREV = ym(prevD); YA = ym(yaD);
  curM = m;
  lblCur  = y+"年"+m+"月";
  lblPrev = prevD.getFullYear()+"年"+(prevD.getMonth()+1)+"月";
  lblYA   = yaD.getFullYear()+"年"+(yaD.getMonth()+1)+"月";
  document.getElementById("title").textContent = curM + "月度 営業部デザイン課";
}
setTarget(ym(new Date(now.getFullYear(), now.getMonth(), 1))); // 初期値は当月

/* ---------- データ取得（JSONP） ---------- */
let DATA = null;
function loadMonthly(){
  if (!GAS){ showMsg("err","GASのURLが指定されていません。入力画面の「月度デザイン」ボタンから開いてください。"); return; }
  window.__onMonthly = function(res){
    if (res && res.status === "ok"){
      DATA = res;
      buildYmSelector();
      render();
    }
    else showMsg("err","データの取得に失敗しました。");
  };
  const s = document.createElement("script");
  s.src = GAS + (GAS.indexOf("?")>=0?"&":"?") + "mode=monthly&callback=__onMonthly&t=" + Date.now();
  s.onerror = function(){ showMsg("err","データの取得に失敗しました。URLとデプロイ設定を確認してください。"); };
  document.body.appendChild(s);
}

/* ---------- 年月セレクタ ---------- */
function buildYmSelector(){
  const sel = document.getElementById("ymSel");
  const keys = Object.keys(DATA.months || {});
  const curKey = ym(new Date(now.getFullYear(), now.getMonth(), 1));
  if (keys.indexOf(curKey) < 0) keys.push(curKey); // 当月は必ず選択可能
  keys.sort().reverse(); // 新しい順
  sel.innerHTML = keys.map(k => {
    const p = k.split("-");
    return '<option value="'+k+'"'+(k===CUR?' selected':'')+'>'+p[0]+'年'+(+p[1])+'月</option>';
  }).join("");
  sel.onchange = function(){ setTarget(this.value); render(); };
}

/* ---------- 集計ユーティリティ ---------- */
function monthData(m){
  const e = (DATA.months && DATA.months[m]) || { groups:{}, total:{count:0,fee:0,hours:0} };
  return e;
}
function catList(){
  const cats = (DATA.groupOrder || []).slice();
  [CUR, PREV, YA].forEach(m => {
    Object.keys(monthData(m).groups).forEach(g => { if (cats.indexOf(g) < 0) cats.push(g); });
  });
  return cats;
}
const fmtN = (v,dec)=> Number(v).toLocaleString("ja-JP",{minimumFractionDigits:dec,maximumFractionDigits:dec});
const diff = (c,p,unit,dec)=>{ const d=c-p; return "("+(d>=0?"+":"")+fmtN(d,dec)+unit+")"; };

/* ---------- 描画 ---------- */
let chartL=null, chartR=null;
function makeChart(canvasId, cmpYM, cmpLbl, title){
  const cats = catList();
  const mc = monthData(CUR).groups, mp = monthData(cmpYM).groups;
  const g = (m,k,f)=> (m[k] ? m[k][f] : 0);
  return new Chart(document.getElementById(canvasId), {
    data: {
      labels: cats,
      datasets: [
        { type:"bar", label:lblCur+"件数", data:cats.map(k=>g(mc,k,"count")), backgroundColor:"#9DC3E6", yAxisID:"y2" },
        { type:"bar", label:cmpLbl+"件数", data:cats.map(k=>g(mp,k,"count")), backgroundColor:"#A9A9A9", yAxisID:"y2" },
        { type:"line", label:lblCur+"金額", data:cats.map(k=>g(mc,k,"fee")), borderColor:"#ED7D31", backgroundColor:"#ED7D31", yAxisID:"y1" },
        { type:"line", label:cmpLbl+"金額", data:cats.map(k=>g(mp,k,"fee")), borderColor:"#70AD47", backgroundColor:"#70AD47", yAxisID:"y1" }
      ]
    },
    options: {
      responsive:true,
      plugins:{ title:{ display:true, text:title, font:{size:15} }, legend:{ position:"bottom" } },
      scales:{
        y1:{ position:"left", beginAtZero:true, title:{display:true,text:"金額（円）"},
             ticks:{ callback:v=>Number(v).toLocaleString() } },
        y2:{ position:"right", beginAtZero:true, title:{display:true,text:"件数"}, grid:{drawOnChartArea:false} }
      }
    }
  });
}

function makeTable(elId, head, rows){
  document.getElementById(elId).innerHTML =
    "<table><tr>"+head.map(h=>"<th>"+h+"</th>").join("")+"</tr>" +
    rows.map(r=>"<tr>"+r.map(c=>"<td>"+c+"</td>").join("")+"</tr>").join("") + "</table>";
}
/* +▲ 記法の差分表示 */
function pmStr(v, unit, dec){
  if (v===null||v===undefined) return "―";
  const s = fmtN(Math.abs(v),dec)+unit;
  return v>=0 ? "(+"+s+")" : "(▲"+s+")";
}
function cellCmp(cur, cmp, unit, dec){
  if (cmp===null||cmp===undefined) return "―";
  return fmtN(cmp,dec)+unit+" "+pmStr(cur-cmp,"",dec);
}

function tableRows(){
  const tc = monthData(CUR).total, tp = monthData(PREV).total, ty = monthData(YA).total;
  const per = t => (t.hours===null||t.hours===undefined||t.hours<=0) ? null : t.fee/t.hours;
  const ov  = t => (t.overtime===null||t.overtime===undefined) ? null : t.overtime;
  const fmtH = h => (h===null||h===undefined) ? "―" : fmtN(h,2)+"時間";
  const pc=per(tc), pp=per(tp), py=per(ty);
  const oc=ov(tc),  op=ov(tp),  oy=ov(ty);
  const groups = (DATA.groupOrder||[]).filter(g=>g!=="未分類");
  const gc = m=>{ const g=monthData(m).groups; return groups.map(k=>g[k]?g[k].count:0); };
  const cc=gc(CUR), cp=gc(PREV), cy=gc(YA);
  return {
    leftHead:  ["", lblCur, lblPrev+"（先月比）", lblYA+"（前年同月比）"],
    rightHead: ["", lblCur+"件数", lblPrev+"（先月比）", lblYA+"（前年同月比）"],
    left: [
      ["総作業件数", fmtN(tc.count,0)+"件", cellCmp(tc.count,tp.count,"件",0), cellCmp(tc.count,ty.count,"件",0)],
      ["金額換算",   fmtN(tc.fee,0)+"円",   cellCmp(tc.fee,tp.fee,"円",0),     cellCmp(tc.fee,ty.fee,"円",0)],
      ["生産時間",   fmtH(tc.hours), fmtH(tp.hours), fmtH(ty.hours)],
      ["残業時間",   oc===null?"―":fmtN(oc,2)+"時間", op===null?"―":fmtN(op,2)+"時間", oy===null?"―":fmtN(oy,2)+"時間"],
      ["1時間あたりの生産額", pc===null?"―":fmtN(pc,1)+"円", pp===null?"―":fmtN(pp,1)+"円", py===null?"―":fmtN(py,1)+"円"]
    ],
    right: groups.map((g,i)=>[
      g, fmtN(cc[i],0)+"件",
      cp[i]===undefined?"―":fmtN(cp[i],0)+"件 "+pmStr(cc[i]-cp[i],"",0),
      cy[i]===undefined?"―":fmtN(cy[i],0)+"件 "+pmStr(cc[i]-cy[i],"",0)
    ])
  };
}

function render(){
  const t1 = "【"+lblCur+"】"+lblPrev+"との比較";
  const t2 = "【"+lblCur+"】"+lblYA+"との比較";
  if (chartL) chartL.destroy();
  if (chartR) chartR.destroy();
  chartL = makeChart("chartLeft", PREV, lblPrev, t1);
  chartR = makeChart("chartRight", YA, lblYA, t2);
  const rows = tableRows();
  makeTable("tblLeft", rows.leftHead, rows.left);
  makeTable("tblRight", rows.rightHead, rows.right);
  document.getElementById("dlBtn").disabled = false;
}

/* ---------- PowerPoint生成 ---------- */
document.getElementById("dlBtn").addEventListener("click", async function(){
  const btn = this;
  const origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = "⏳ 生成中...";
  document.body.style.cursor = "wait";
  try {
  const pptx = new PptxGenJS();
  pptx.defineLayout({ name:"A4L", width:11.69, height:8.27 });
  pptx.layout = "A4L";
  const s = pptx.addSlide();
  const FONT = "メイリオ";

  s.addText(curM + "月度 営業部デザイン課", { x:0.3, y:0.1, w:8, h:0.45, fontSize:20, bold:true, fontFace:FONT });

  s.addImage({ data: document.getElementById("chartLeft").toDataURL("image/png"),  x:0.3,  y:0.6, w:5.55 });
  s.addImage({ data: document.getElementById("chartRight").toDataURL("image/png"), x:5.85, y:0.6, w:5.55 });

  const rows = tableRows();
  const mk = (head, arr) => [head.map(h=>({text:h,options:{bold:true,fill:"E8EEF7"}}))]
    .concat(arr.map(r=>r.map(c=>({text:String(c),options:{}}))));
  const tblOpts = { y:4.6, w:5.55, border:{pt:0.75,color:"999999"}, fontSize:9, fontFace:FONT,
                    align:"center", valign:"middle", margin:0.02 };
  s.addTable(mk(rows.leftHead,  rows.left),  Object.assign({ x:0.3,  colW:[1.5,0.95,1.55,1.55] }, tblOpts));
  s.addTable(mk(rows.rightHead, rows.right), Object.assign({ x:5.85, colW:[1.05,0.95,1.75,1.8] }, tblOpts));

  s.addText("コメント：", { x:0.3, y:6.55, w:11.1, h:1.6, fontSize:11, bold:true, fontFace:FONT,
                            line:{ color:"000000", width:0.75 }, valign:"top" });

  const fileName = curD.getFullYear()+"年"+curM+"月度_営業部デザイン課.pptx";
  const blob = await pptx.write("blob");
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
  showMsg("ok", "PowerPoint（"+fileName+"）をダウンロードしました。");
  } catch(e) {
    showMsg("err", "PowerPointの生成に失敗しました：" + (e && e.message ? e.message : e));
  } finally {
    btn.disabled = false;
    btn.textContent = origText;
    document.body.style.cursor = "";
  }
});

loadMonthly();
</script>
</body>
</html>
